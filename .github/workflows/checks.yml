# فحوص كل تغيير: تحليل واختبار وتنسيق في الحزم الثلاث، وتطابق رقم الإصدار.
#
# يعمل على كل دفعة إلى `dev` وعلى كل مراجعة، ويستدعيه `release.yml` قبل أي
# إصدار. القاعدة `08` §7.

name: checks

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
  push:
    branches: [dev]

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  engine:
    name: المحرّك وسطر الأوامر
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: المحرّك
        working-directory: packages/e3ks_engine
        run: |
          dart pub get --enforce-lockfile
          dart analyze --fatal-infos
          dart test
      - name: سطر الأوامر
        working-directory: tools/e3ks_cli
        run: |
          dart pub get --enforce-lockfile
          dart analyze --fatal-infos

  app:
    name: التطبيق
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      # اختبارات الواجهة تعمل بلا شاشة، والتي تحتاج مستندًا حقيقيًّا تتخطّى
      # نفسها بـ`markTestSkipped` — مستندات العملاء لا تدخل المستودع (`04` §4).
      - name: تحليل واختبار
        working-directory: apps/e3ks_desktop
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --fatal-infos
          flutter test

  hygiene:
    name: التنسيق ورقم الإصدار
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: التنسيق
        run: |
          dart format --output=none --set-exit-if-changed \
            packages/e3ks_engine/lib packages/e3ks_engine/test \
            apps/e3ks_desktop/lib apps/e3ks_desktop/test apps/e3ks_desktop/tool \
            tools/e3ks_cli/bin tools/e3ks_cli/lib tools/release
      # الرقم في أربعة مواضع — القاعدة `08` §3.
      - name: تطابق رقم الإصدار
        run: dart tools/release/bump_version.dart --check
