# فحوص كل تغيير.
#
# **الوظيفة تشغّل `tools/checks.sh` نفسه الذي تشغّله على جهازك**، فقائمة
# الفحوص واحدة والفرق بيئة العامل وحدها. ملفّان بقائمتين ينحرفان، فيمرّ
# الشغل محليًّا ويسقط هنا — وقد وقع ذلك فعلًا.
#
# يعمل على كل دفعة إلى `dev` وعلى كل مراجعة، ويستدعيه `release.yml` قبل أي
# إصدار. القاعدة `08` §7.

name: checks

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
  push:
    branches: [dev]

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  checks:
    name: تحليل واختبار وتنسيق
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      # `--no-build`: البناء على المنصّات الثلاث في `build.yml`، ولا معنى
      # لتكراره في كل دفعة.
      #
      # واختبارات المستند الحقيقي تتخطّى نفسها هنا: مستندات العملاء لا تدخل
      # المستودع (`04` §4).
      - name: الفحوص
        run: ./tools/checks.sh --no-build
