# تحقّق البناء: يجمّع التطبيق على المنصّات الثلاث ويرفع الناتج للتجربة.
#
# **هذا هو الطريق الوحيد للتحقّق من ويندوز ولينكس**: البناء يحتاج عاملًا من
# نفس النظام، فلا يُجمَّع أيٌّ منهما على جهاز التطوير. شغّله يدويًّا من تبويب
# Actions بعد أي تغيير يمسّ مجلّدات `windows/` أو `linux/` أو `macos/`.
#
# لا وسم ولا نشر هنا — ذلك في `release.yml`.

name: build

on:
  workflow_dispatch:
  workflow_call:

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      # منصّة تسقط لا تُخفي حال الأخريين: نريد الصورة كاملة من تشغيلة واحدة.
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, platform: macos }
          - { os: windows-latest, platform: windows }
          - { os: ubuntu-latest, platform: linux }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: اعتماديات GTK
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config

      # `--enforce-lockfile`: العامل يبني بنفس نسخ الحزم المُلتزَمة بالضبط.
      # بدونه يرفع `pub` ما تسمح به القيود، فيختلف المبنيّ عمّا اختُبر.
      - name: الحزم
        working-directory: apps/e3ks_desktop
        run: flutter pub get --enforce-lockfile

      - name: بناء
        working-directory: apps/e3ks_desktop
        run: flutter build ${{ matrix.platform }} --release

      - name: تحزيم macOS
        if: matrix.platform == 'macos'
        working-directory: apps/e3ks_desktop
        run: |
          set -euo pipefail
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)
          ditto -c -k --keepParent "$APP" "../../E3KS-macos.zip"

      - name: تحزيم Windows
        if: matrix.platform == 'windows'
        working-directory: apps/e3ks_desktop
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ../../E3KS-windows.zip

      - name: تحزيم Linux
        if: matrix.platform == 'linux'
        working-directory: apps/e3ks_desktop
        run: tar -czf ../../E3KS-linux.tar.gz -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: e3ks-${{ matrix.platform }}
          path: |
            E3KS-*.zip
            E3KS-*.tar.gz
          if-no-files-found: error
          retention-days: 7
