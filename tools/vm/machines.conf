# تعريف آلات المصفوفة. **مصدر واحد** يقرأه `run.sh` و`Vagrantfile` معًا،
# فلا تُعرَّف آلة في مكانين وتنحرف.
#
# الأعمدة:
#   name      اسم الآلة كما تكتبه في `run.sh <name>`
#   backend   vagrant أو tart
#   os        linux أو windows أو macos — يقرّر التهيئة وطريقة الوصول
#   image     صندوق Vagrant أو صورة Tart
#   cpus
#   memory    بالميغابايت
#
# تبديل مزوّد آلة تغييرُ كلمة في عمود `backend`: لو نصّبت Parallels وبنيت
# صندوق macOS، صارت `macos vagrant ...` بلا تعديل في أي سكربت.

# name     backend  os       image                                          cpus  memory
linux      vagrant  linux    bento/ubuntu-24.04                             4     8192
windows    vagrant  windows  gusztavvargadr/windows-11                      4     12288
macos      vagrant  macos    andrewgregory/macOS                            4     8192
