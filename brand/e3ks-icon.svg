<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="E3KS">
  <title>E3KS</title>

  <!--
    الرمز = Ǝ واحد يعبر من هوية إلى هوية.

      Ǝ            حرف E معكوس: «اعكس»، وهو أيضًا البُعد الطباعي (الخطوط).
      القطر        حدّ التحويل، من ركن إلى الركن المقابل، ويمرّ في مركز الحرف.
      الجهتان      هويتان مختلفتان لا انعكاس لون واحد:
                     الأولى  حبر داكن على ورق فاتح   (هوية المستند كما جاء)
                     الثانية سماوي على الحبر نفسه     (الهوية بعد العكس)
                   الحبر نفسه أرضيةٌ هنا وحرفٌ هناك — وهذا هو العكس بعينه.

    مسطّح: لا تدرّج، لا ظلّ، لا حدود، لا عناصر إضافية. تعبئة خالصة فقط.
    الشبكة: خمسة أشرطة (شريط 58، فراغ 62) — لا يقلّ أيّها عن ‎1.8px‎ عند 16px.
  -->

  <defs>
    <!-- إطار الأيقونة -->
    <clipPath id="frame">
      <rect x="0" y="0" width="512" height="512" rx="114" ry="114"/>
    </clipPath>

    <!-- النصف الأول: المثلث العلوي الأيسر، حدّه القطر x + y = 512 -->
    <clipPath id="firstIdentity">
      <path d="M0 0 H512 L0 512 Z"/>
    </clipPath>

    <!-- الحرف: ساق يمنى وثلاثة أذرع يسارية. الأوسط أقصر كما في الحرف الحقيقي. -->
    <g id="mark">
      <rect x="329" y="107" width="58"  height="298" rx="11"/>
      <rect x="125" y="107" width="262" height="58"  rx="11"/>
      <rect x="179" y="227" width="208" height="58"  rx="11"/>
      <rect x="125" y="347" width="262" height="58"  rx="11"/>
    </g>
  </defs>

  <g clip-path="url(#frame)">
    <!-- الهوية الثانية تملأ الأيقونة كاملة -->
    <rect width="512" height="512" fill="#0B1013"/>
    <use href="#mark" fill="#4FD6E8"/>

    <!-- ثم الهوية الأولى تغطّي نصفها؛ الحرف ينقلب من نفسه بلا نسخة ثانية -->
    <g clip-path="url(#firstIdentity)">
      <rect width="512" height="512" fill="#F5F8F9"/>
      <use href="#mark" fill="#0B1013"/>
    </g>
  </g>
</svg>
