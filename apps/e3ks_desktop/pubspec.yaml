name: e3ks_desktop
description: E3KS — اعكس. تطبيق سطح مكتب لعكس الهوية البصرية في المستندات.
publish_to: none
repository: https://github.com/m7md-d/E3KS
issue_tracker: https://github.com/m7md-d/E3KS/issues
version: 0.2.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  # الترجمة الرسمية: ملفات ARB يقرؤها المترجم بلا برمجة.
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # المحرّك — كل المنطق هناك، ولا منطق تحويل في هذه الحزمة (القاعدة 01).
  e3ks_engine:
    path: ../../packages/e3ks_engine

  # حوارا الفتح والحفظ الأصليان (فريق Flutter).
  file_selector: ^1.0.3
  # السحب والإفلات على النافذة.
  desktop_drop: ^0.6.1

  # الأيقونات — مكتبة جاهزة، خطّ أيقونات نقيّ بلا كود أصلي.
  lucide_icons_flutter: ^3.1.17

  # لا حزمة لإدارة الحالة: ChangeNotifier + ListenableBuilder من النواة تكفي.

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  # نصوص رخص الخطوط تُشحَن **وتُقرَأ**: تُسجَّل في سجلّ رخص Flutter فتظهر
  # للمستخدم في «رخص المكوّنات». شحنها بلا عرضها يفي بالحرف لا بالغرض.
  # ورخصة OFL تشترط مرافقة نصّها للخطّ، فلكلّ عائلة ملفّها.
  assets:
    - assets/fonts/OFL-IBMPlexSansArabic.txt
    - assets/fonts/OFL-NotoSansArabic.txt
    - assets/fonts/OFL-Cairo.txt
    - assets/fonts/OFL-Tajawal.txt
    - assets/fonts/OFL-IBMPlexSans.txt
    - assets/fonts/OFL-Inter.txt
    - assets/fonts/OFL-Arimo.txt
    - assets/fonts/OFL-Carlito.txt
    - assets/fonts/OFL-Gelasio.txt

  # الخطوط مضمَّنة لا مطلوبة من النظام: التطبيق يبدو واحدًا على كل جهاز،
  # والمعاينة ترسم خطّ المستند بلا شبكة. كلّها OFL 1.1 — وهي الرخصة
  # الوحيدة هنا التي تجيز الشحن، متحقَّقًا منها داخل كل ملفّ خطّ.
  fonts:
    # ١ — خطّ الواجهة. أوزان أربعة لأن الواجهة تستعملها كلّها.
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700

    # ٢ — خطوط المستندات المقترحة. وزنان يكفيان: المعاينة ترسم عاديًّا
    # وعريضًا، وطلب وزن غير مضمَّن يجعل Flutter يصطنعه فيبهت.
    - family: Noto Sans Arabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

    # ٣ — بدائل مطابقة مقاسيًّا لخطوط مملوكة لا يجوز شحنها.
    # تُشحَن **بأسمائها الحقيقية**، والإحلال يقرّره `font_substitutes.dart`
    # وحده. شحن Carlito تحت اسم «Calibri» يخفي ما نوزّعه فعلًا.
    - family: Arimo
      fonts:
        - asset: assets/fonts/Arimo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Arimo-Bold.ttf
          weight: 700
    - family: Carlito
      fonts:
        - asset: assets/fonts/Carlito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Carlito-Bold.ttf
          weight: 700
    - family: Gelasio
      fonts:
        - asset: assets/fonts/Gelasio-Regular.ttf
          weight: 400
        - asset: assets/fonts/Gelasio-Bold.ttf
          weight: 700
